# ============================================
# PALETTES (switch with `palette = "..."` at the top)
# ============================================

# Tuned Ghostty Aura (~/.config/ghostty/themes/aura). No green in it:
# "green" is the theme's deep cyan, so success and additions read cyan.
[palettes.aura]
bg = "#0a0810"
current = "#231d33"
fg = "#f2f0f7"
comment = "#6f6889"
cyan = "#5ce4ff"
green = "#22d3ff"
orange = "#ffab4d"
pink = "#ff7bd5"
