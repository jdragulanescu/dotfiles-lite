<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="template-version" content="2" />
    <title>TITLE</title>
    <style data-template>
      :root {
        --bg: #0b0b0c;
        --bg-2: #111113;
        --bg-3: #18181b;
        --line: #26262b;
        --line-2: #34343b;
        --fg: #ededee;
        --fg-2: #a1a1aa;
        --fg-3: #6b6b74;
        --accent: #f97316;
        --accent-dim: rgba(249, 115, 22, 0.12);
        --blue: #60a5fa;
        --blue-dim: rgba(96, 165, 250, 0.1);
        --green: #4ade80;
        --green-dim: rgba(74, 222, 128, 0.1);
        --amber: #fbbf24;
        --amber-dim: rgba(251, 191, 36, 0.1);
        --red: #f87171;
        --red-dim: rgba(248, 113, 113, 0.1);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 2rem;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.7 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: #000;
      }
      a {
        color: var(--fg);
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
      }
      a:hover {
        text-decoration-color: var(--accent);
      }

      /* ---------- top bar ---------- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
        background: rgba(11, 11, 12, 0.8);
        border-bottom: 1px solid var(--line);
      }
      .bar .in {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0.8rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font: 13px var(--mono);
        color: var(--fg-2);
      }
      .bar .logo {
        color: var(--fg);
        letter-spacing: 0.02em;
      }
      .bar .logo span {
        color: var(--accent);
      }

      /* ---------- layout ---------- */
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 4rem;
      }
      article {
        max-width: 720px;
        padding: 4rem 0 8rem;
      }
      aside.toc {
        position: sticky;
        top: 5rem;
        align-self: start;
        padding-top: 4rem;
        font: 12.5px/1.5 var(--mono);
      }
      aside.toc .h {
        color: var(--fg-3);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.8rem;
      }
      aside.toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 1px solid var(--line);
      }
      aside.toc a {
        display: block;
        padding: 0.25rem 0 0.25rem 1rem;
        margin-left: -1px;
        color: var(--fg-3);
        text-decoration: none;
        border-left: 1px solid transparent;
      }
      aside.toc a:hover {
        color: var(--fg);
      }
      aside.toc a.on {
        color: var(--fg);
        border-left-color: var(--accent);
      }

      /* ---------- hero ---------- */
      .meta {
        font: 13px var(--mono);
        color: var(--fg-3);
        display: flex;
        gap: 1.2rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      .meta b {
        color: var(--fg-2);
        font-weight: 400;
      }
      h1 {
        font-size: clamp(2.2rem, 5vw, 3.2rem);
        line-height: 1.08;
        letter-spacing: -0.035em;
        font-weight: 600;
        margin: 0 0 1.25rem;
      }
      .lede {
        font-size: 1.2rem;
        line-height: 1.6;
        color: var(--fg-2);
        margin: 0 0 2.5rem;
      }

      /* ---------- typography ---------- */
      h2 {
        font-size: 1.65rem;
        letter-spacing: -0.02em;
        font-weight: 600;
        line-height: 1.25;
        margin: 5rem 0 1rem;
        padding-top: 2rem;
        border-top: 1px solid var(--line);
      }
      h2 .n {
        display: block;
        font: 12px var(--mono);
        color: var(--accent);
        letter-spacing: 0.12em;
        margin-bottom: 0.5rem;
      }
      h3 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 2.5rem 0 0.6rem;
      }
      p,
      li {
        color: #d4d4d8;
      }
      strong,
      b {
        color: var(--fg);
        font-weight: 600;
      }
      ul,
      ol {
        padding-left: 1.3rem;
      }
      li {
        margin: 0.3rem 0;
      }
      code {
        font: 0.86em var(--mono);
        background: var(--bg-3);
        border: 1px solid var(--line);
        padding: 0.1em 0.38em;
        border-radius: 4px;
        color: var(--fg);
      }

      pre {
        font: 13.5px/1.65 var(--mono);
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1.1rem 1.25rem;
        overflow-x: auto;
        margin: 1.25rem 0;
      }
      pre code {
        background: none;
        border: none;
        padding: 0;
        font-size: inherit;
        color: #d4d4d8;
      }
      pre .c {
        color: var(--fg-3);
      }
      pre .k {
        color: var(--accent);
      }
      pre .s {
        color: var(--green);
      }
      pre .f {
        color: var(--blue);
      }
      .codehead {
        font: 12px var(--mono);
        color: var(--fg-3);
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        padding: 0.5rem 1rem;
        margin-top: 1.25rem;
      }
      .codehead + pre {
        margin-top: 0;
        border-radius: 0 0 8px 8px;
      }

      /* ---------- tables ---------- */
      .tbl {
        overflow-x: auto;
        margin: 1.25rem 0 1.75rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 0.65rem 0.9rem 0.65rem 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      tr:last-child td {
        border-bottom: none;
      }
      th {
        font: 11.5px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fg-3);
        font-weight: 400;
        border-bottom-color: var(--line-2);
      }
      td {
        color: #d4d4d8;
      }
      td.num {
        font-family: var(--mono);
        font-size: 13px;
        text-align: right;
        white-space: nowrap;
        color: var(--fg);
      }
      tr.total td {
        color: var(--fg);
        font-weight: 600;
        border-top: 1px solid var(--line-2);
      }

      /* ---------- callouts ---------- */
      .call {
        border: 1px solid var(--line);
        background: var(--bg-2);
        border-radius: 8px;
        padding: 1rem 1.2rem;
        margin: 1.5rem 0;
        font-size: 15px;
      }
      .call p {
        margin: 0.25rem 0 0;
      }
      .call .t {
        font: 12px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--fg-3);
      }
      .call.note .t {
        color: var(--blue);
      }
      .call.warn .t {
        color: var(--amber);
      }
      .call.risk .t {
        color: var(--red);
      }
      .call.tip .t {
        color: var(--green);
      }

      /* ---------- deep dives (collapsible) ---------- */
      details.dive {
        border: 1px solid var(--line);
        background: var(--bg-2);
        border-radius: 8px;
        margin: 0.75rem 0;
        font-size: 15px;
      }
      details.dive > summary {
        list-style: none;
        cursor: pointer;
        padding: 0.85rem 1.2rem;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        user-select: none;
      }
      details.dive > summary::-webkit-details-marker {
        display: none;
      }
      details.dive > summary::before {
        content: "›";
        font: 18px/1 var(--mono);
        color: var(--fg-3);
        transition: transform 0.15s;
        width: 0.8rem;
      }
      details.dive[open] > summary::before {
        transform: rotate(90deg);
      }
      details.dive > summary .k {
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--blue);
      }
      details.dive > summary:hover {
        background: var(--bg-3);
        border-radius: 8px;
      }
      details.dive > .body {
        padding: 0.25rem 1.2rem 1rem 2.75rem;
        border-top: 1px solid var(--line);
      }
      details.dive > .body p {
        margin: 0.75rem 0 0;
      }
      details.dive .eq {
        margin: 0.75rem 0;
      }

      .pill {
        font: 11px var(--mono);
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        border: 1px solid;
        vertical-align: 2px;
        letter-spacing: 0.04em;
      }
      .pill.assume {
        color: var(--amber);
        border-color: rgba(251, 191, 36, 0.4);
      }
      .pill.ok {
        color: var(--green);
        border-color: rgba(74, 222, 128, 0.4);
      }

      /* ---------- formula blocks ---------- */
      .eq {
        font: 14px/1.9 var(--mono);
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1.25rem 0;
        white-space: pre;
        overflow-x: auto;
        color: var(--fg);
      }
      .eq .c {
        color: var(--fg-3);
      }
      .eq .a {
        color: var(--accent);
      }

      /* ---------- figures ---------- */
      figure {
        margin: 2rem 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-2);
        padding: 1.5rem 1.25rem 1rem;
      }
      figure svg {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        font: 12.5px var(--mono);
        color: var(--fg-3);
        margin-top: 0.9rem;
        text-align: center;
      }
      svg text {
        font-family: var(--mono);
      }

      /* ---------- steps ---------- */
      ol.steps {
        list-style: none;
        padding: 0;
        counter-reset: st;
        margin: 1.5rem 0;
      }
      ol.steps > li {
        counter-increment: st;
        position: relative;
        padding: 0 0 1.1rem 2.75rem;
        margin: 0;
        border-left: 1px solid var(--line);
        margin-left: 0.85rem;
      }
      ol.steps > li:last-child {
        border-left-color: transparent;
      }
      ol.steps > li::before {
        content: counter(st);
        position: absolute;
        left: -0.85rem;
        top: 0;
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--line-2);
        font: 12px/1.6rem var(--mono);
        text-align: center;
        color: var(--accent);
      }

      /* ---------- cards ---------- */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--bg-2);
        border-radius: 8px;
        padding: 1.1rem 1.2rem;
      }
      .card .k {
        font: 11.5px var(--mono);
        color: var(--accent);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .card h4 {
        margin: 0.35rem 0 0.4rem;
        font-size: 1rem;
      }
      .card p {
        margin: 0;
        font-size: 14.5px;
        color: var(--fg-2);
      }

      /* ---------- playground ---------- */
      .play {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-2);
        margin: 1.5rem 0;
        overflow: hidden;
      }
      .play .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .play .tabs button {
        font: 12.5px var(--mono);
        background: none;
        border: none;
        border-right: 1px solid var(--line);
        color: var(--fg-3);
        padding: 0.75rem 1.1rem;
        cursor: pointer;
      }
      .play .tabs button[aria-selected="true"] {
        color: var(--fg);
        background: var(--bg-2);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .play .panel {
        display: none;
        padding: 1.25rem;
        gap: 1.5rem;
        grid-template-columns: 1fr 1.2fr;
      }
      .play .panel.active {
        display: grid;
      }
      .play label {
        display: block;
        font: 11.5px var(--mono);
        color: var(--fg-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0.7rem 0 0.3rem;
      }
      .play label:first-child {
        margin-top: 0;
      }
      .play input {
        width: 100%;
        font: 14px var(--mono);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 0.5rem 0.65rem;
        color-scheme: dark;
      }
      .play input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .play .out {
        font: 13px/1.8 var(--mono);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1rem;
        white-space: pre-wrap;
        color: var(--fg-2);
      }
      .play .out b {
        color: var(--accent);
        font-weight: 400;
      }

      footer {
        border-top: 1px solid var(--line);
        margin-top: 5rem;
        padding-top: 1.5rem;
        font: 12.5px/1.7 var(--mono);
        color: var(--fg-3);
      }

      @media (max-width: 1000px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        aside.toc {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .grid,
        .play .panel.active {
          grid-template-columns: 1fr;
        }
        article {
          padding-top: 2.5rem;
        }
      }

      /* ---------- glossary links ---------- */
      a.g {
        text-decoration: underline dotted;
        text-decoration-color: var(--fg-3);
        text-underline-offset: 3px;
        cursor: help;
      }
      a.g:hover {
        text-decoration-color: var(--accent);
        color: var(--fg);
      }
      .gtip {
        position: absolute;
        z-index: 50;
        max-width: 320px;
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--fg-2);
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      .gtip b {
        display: block;
        color: var(--fg);
        font-size: 13px;
        margin-bottom: 0.15rem;
      }
      dl.gloss {
        margin: 1.5rem 0;
        border-top: 1px solid var(--line);
      }
      dl.gloss dt {
        font-weight: 600;
        color: var(--fg);
        padding-top: 0.8rem;
        scroll-margin-top: 5rem;
      }
      dl.gloss dt i {
        font-weight: 400;
        color: var(--fg-3);
        font-size: 0.9em;
      }
      dl.gloss dd {
        margin: 0.15rem 0 0;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid var(--line);
        color: #d4d4d8;
        font-size: 15px;
      }
      dl.gloss dt:target,
      dl.gloss dt:target + dd {
        background: var(--accent-dim);
      }
      a.card {
        display: block;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a.card:hover {
        border-color: var(--line-2);
      }
      .grp {
        font: 11.5px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .srcline {
        font-size: 12px;
        color: var(--fg-3, #6b6b74);
        margin-top: 0.4rem;
      }
      .srcline a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: #34343b;
      }
      .src {
        font: 10px var(--mono);
        padding: 0 0.35rem;
        border-radius: 4px;
        border: 1px solid;
        white-space: nowrap;
        margin-left: 0.2rem;
      }
      .src.c-contract {
        color: var(--amber);
        border-color: rgba(251, 191, 36, 0.35);
      }
      .src.c-trade {
        color: var(--green);
        border-color: rgba(74, 222, 128, 0.35);
      }
      .src.c-derived {
        color: var(--accent);
        border-color: rgba(249, 115, 22, 0.35);
      }
      aside.toc ol ol {
        border-left: none;
        margin: 0.1rem 0 0.4rem;
      }
      aside.toc ol ol a {
        padding-left: 1.75rem;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="in">
        <div class="logo">PROJECT<span>/</span>docs</div>
        <div>TOPIC · KIND</div>
      </div>
    </div>

    <div class="wrap">
      <article>
        <div class="meta">
          <span><b>Audience</b> WHO</span>
          <span><b>Read time</b> ~N min</span>
        </div>

        <h1>TITLE</h1>
        <p class="lede">ONE OR TWO SENTENCES: WHAT THE READER GETS.</p>

        <!-- ======================================================= -->
        <h2 id="first"><span class="n">01 · LABEL</span>Section title</h2>
        <p>Prose.</p>

        <!-- ======================================================= -->
        <h2 id="glossary"><span class="n">GLOSSARY</span>Glossary</h2>
        <dl class="gloss">
          <dt id="g-term">Term <i>(also: other name)</i></dt>
          <dd>One definition. The only one in the page.</dd>
        </dl>

        <footer>SOURCE / DATE / OWNER</footer>
      </article>

      <aside class="toc">
        <div class="h">On this page</div>
        <ol>
          <li><a href="#first">Section title</a></li>
          <li><a href="#glossary">Glossary</a></li>
        </ol>
      </aside>
    </div>

    <script data-template>
      document.querySelectorAll(".play .tabs button").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll(".play .tabs button")
            .forEach((x) => x.setAttribute("aria-selected", x === b));
          document
            .querySelectorAll(".play .panel")
            .forEach((p) =>
              p.classList.toggle("active", p.id === b.dataset.tab),
            );
        }),
      );

      // highlight the current section in the table of contents
      const links = [...document.querySelectorAll("aside.toc a")];
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting)
              links.forEach((l) =>
                l.classList.toggle(
                  "on",
                  l.getAttribute("href") === "#" + e.target.id,
                ),
              );
          }),
        { rootMargin: "-20% 0px -70% 0px" },
      );
      document.querySelectorAll("h2[id], h3[id]").forEach((h) => io.observe(h));

      // glossary tooltips: the text comes from the glossary, so each definition exists one time
      const tip = document.createElement("div");
      tip.className = "gtip";
      tip.hidden = true;
      document.body.appendChild(tip);
      const copiesOfChildren = (el) =>
        [...el.childNodes].map((n) => n.cloneNode(true));
      document.querySelectorAll("a.g").forEach((a) => {
        const dt = document.getElementById(a.getAttribute("href").slice(1));
        if (!dt) return;
        a.addEventListener("mouseenter", () => {
          const term = document.createElement("b");
          term.append(...copiesOfChildren(dt));
          tip.replaceChildren(term, ...copiesOfChildren(dt.nextElementSibling));
          const r = a.getBoundingClientRect();
          tip.hidden = false;
          tip.style.left =
            Math.min(r.left + scrollX, scrollX + innerWidth - 340) + "px";
          tip.style.top = r.bottom + scrollY + 6 + "px";
        });
        a.addEventListener("mouseleave", () => {
          tip.hidden = true;
        });
      });
    </script>
  </body>
</html>
